<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        
        <div class="visual-panel">
            <div class="album-card">
                <div class="vinyl-container" id="vinylDisc">
                    <div class="vinyl-center">
                        <div class="label"></div>
                    </div>
                </div>
                <div class="glow-spot"></div>
            </div>
            <div class="track-info">
                <h1 class="song-title">Lovely</h1>
                <h2 class="artist-name">Billie Eilish ft. Khalid</h2>
                <h3 class="album-year">13 Reasons Why Season 2 (2025)</h3>
            </div>
        </div>

        <div class="control-panel">
            
            <div class="controls-wrapper">
                <div class="timeline-container">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="seekBar" value="0" max="100" aria-label="Seek track">
                    <span id="duration">0:00</span>
                </div>

                <div class="buttons-row">
                    <button class="ctrl-btn secondary" id="prevBtn" aria-label="Previous track"><i class="fas fa-backward"></i></button>
                    <button class="ctrl-btn primary" id="playBtn" aria-label="Play or pause"><i class="fas fa-play"></i></button>
                    <button class="ctrl-btn secondary" id="nextBtn" aria-label="Next track"><i class="fas fa-forward"></i></button>
                </div>

                <div class="volume-wrapper">
                    <i class="fas fa-volume-up" aria-hidden="true"></i>
                    <input type="range" id="volumeBar" value="80" min="0" max="100" aria-label="Volume control">
                </div>
            </div>

            <div class="lyrics-display" id="lyricsContainer">
                <div class="lyrics-content" id="lyricsTrack">
                    </div>
            </div>
        </div>
    </div>

    <audio id="mobileAudio" src="https://files.catbox.moe/qv9phc.mpeg" preload="auto"></audio>
    
    <script src="script.js"></script>
</body>
</html>
